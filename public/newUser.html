<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/User" method="POST">
        <h1>Nuevo usuario</h1>

        <p>
            <label for="username">Nombre de usuario</label>
            <input
            type="text"
            id="username"
            name="username"
            required
            minlength="8"
            maxlength="20"
            autocomplete="username"
            placeholder="p.ej. jgomez"
            pattern="^[a-zA-Z0-9._-]{8,20}$"
            title="De 8 a 20 caracteres; letras, números, punto, guion y guion bajo."
            />
        </p>

        <p>
            <label for="password">Password: </label>
            <input
            type="password"
            id="password"
            name="password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Mínimo 8 caracteres"
            title="Mínimo 8 caracteres. Se recomienda incluir mayúsculas, minúsculas, números y símbolos."
            />
        </p>
            
        <p>       
            <label for="phone">Teléfono</label>
            <input
            type="tel"
            id="phone"
            name="phone"
            inputmode="tel"
            autocomplete="tel"
            placeholder="+34 600 123 456"
            pattern="[0-9+\s\-()]{7,}"
            title="Introduce un teléfono válido (puede incluir +, espacios, guiones y paréntesis)."
            />
        </p>    
    
        <p>
            <label for="email">Email</label>
            <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            placeholder="usuario@dominio.com"
            />
        </p>

        <p>
            <label for="postal_code">Código postal</label>
            <input
            type="text"
            id="postal_code"
            name="zip_code"
            inputmode="numeric"
            autocomplete="postal-code"
            placeholder="28001"
            pattern="^\d{5}$"
            maxlength="5"
            title="Introduce un código postal de 5 dígitos."
            required
            />
            <small id="postalHelp">Formato España: 5 dígitos (ej. 28001).</small>
        </p>

    <p>
        <button type="submit">Registrar</button>
    </p>
  </form>
</body>
</html>
